# Render Blueprint: Dashboard -> New -> Blueprint, pick this repo.
# Creates the web service (dashboard + API, one Docker image) and a Postgres database.
services:
  - type: web
    name: kidputer-control
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Paid instance: free instances sleep when idle, so the PC would see the API as offline
    # (it keeps enforcing from its cache) and dashboard actions would be delayed while it wakes.
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: KC_DATABASE_URL
        fromDatabase:
          name: kidputer-control-db
          property: connectionString
      # First admin, created at startup only while no admin exists. Set both in the Render
      # dashboard when prompted, sign in, then delete KC_BOOTSTRAP_ADMIN_PASSWORD.
      - key: KC_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: kidputer-control-db
    databaseName: kidputercontrol
    # Paid plan: Render's free Postgres expires after 30 days.
    plan: basic-256mb
    ipAllowList: []   # reachable only from Render services in this account
