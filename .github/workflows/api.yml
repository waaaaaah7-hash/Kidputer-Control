name: API

on:
  push:
    paths: ["server/**", "agent/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["server/**", "agent/**", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: sm
          POSTGRES_DB: sessionmonitor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sm" --health-interval 2s --health-retries 15
    defaults:
      run:
        working-directory: server
    env:
      SM_TEST_DATABASE_URL: postgresql+psycopg://sm:sm@localhost:5432/sessionmonitor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Migrations match models
        run: SM_DATABASE_URL=$SM_TEST_DATABASE_URL alembic upgrade head && SM_DATABASE_URL=$SM_TEST_DATABASE_URL alembic check
      # Includes the agent<->API integration test (pwsh is preinstalled on ubuntu-latest).
      - run: pytest -q
